[package]
name = "q17-physical-rule"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
datafusion = { version = "=32.0.0", default-features = false }
# Arrow 47 predates Chrono's Datelike::quarter; pin the compatible API.
chrono = "=0.4.31"
tokio = { version = "=1.32.0", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = 0
strip = "debuginfo"
